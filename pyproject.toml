[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caliban-ml"
version = "0.1.0"
description = "Offline training, evaluation and export for Caliban's in-process models. Output contract to caliban core: ONNX files + JSON manifests/profile tables."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Caliban" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
# Core deps are deliberately light: everything in the default install must run
# offline, on CPU, with no model downloads. Heavy ML deps live in extras.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# Training: run on a build/training box, never inside the data plane.
train = [
    "torch>=2.4",
    "transformers>=4.48",  # ModernBERT support
    "sentence-transformers>=3.3",
    "setfit>=1.1",
    "datasets>=3.0",
    "gliner>=0.2.16",
]
# ONNX export, quantization and parity checks.
export = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "optimum[onnxruntime]>=1.23",
]
# Presidio adapter for the PII eval harness (needs a locally installed spaCy model).
presidio = [
    "presidio-analyzer>=2.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
caliban-ml = "caliban_ml.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/caliban_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # typer.Option(...) in defaults is the typer idiom
    "RUF001", # allow unicode in strings (e.g. placeholder brackets)
]
